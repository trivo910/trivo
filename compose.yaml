name: trivo

x-app: &app
  image: trivo-app:${IMAGE_TAG:-latest}
  build:
    context: .
    target: production
  env_file:
    - .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-trivo}
    DB_USERNAME: ${DB_USERNAME:-trivo_app}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    LOG_CHANNEL: stderr
    CACHE_STORE: file
    QUEUE_CONNECTION: database
    MEDIA_PUBLIC_ROOT: /var/www/html/storage/app/public
    MEDIA_PRIVATE_ROOT: /var/www/html/storage/app/private
  volumes:
    - app-storage:/var/www/html/storage
    # Imported WordPress uploads are transferred separately from Git.
    - ${LEGACY_UPLOADS_PATH:-./public/wp-content/uploads}:/var/www/html/public/wp-content/uploads:ro
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    stop_grace_period: 70s
    # routes/console.php already schedules bounded queue processing.

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-trivo}
      MARIADB_USER: ${DB_USERNAME:-trivo_app}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  web:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-storage:
  database:
  caddy-data:
  caddy-config:
